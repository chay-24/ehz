name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # govet/staticcheck run inside golangci-lint, so there is no separate
      # 'go vet' step.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: format
        run: golangci-lint fmt --diff
