version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/chay-24/ehz/cmd.version={{.Version}}

homebrew_casks:
  - repository:
      owner: chay-24
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/chay-24/ehz
    description: CLI for inspecting Strimzi Kafka messages on OpenShift.
    hooks:
      post:
        # Binaries are unsigned; without this macOS Gatekeeper blocks them.
        # Guard on OS.mac? — /usr/bin/xattr does not exist on Linux and
        # system_command raises (not just non-zero) when it is missing.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ehz"]
          end
